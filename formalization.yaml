# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: NKBesicovitch
  description: >-
    Work in progress toward positive Lebesgue measure for (n,k)-Besicovitch
    sets when p_c^(k-1)+k>n, and for (5,2), where p_c is the root in (2,3) of
    p^3-2p^2-2p+2=0. The project specifies the full statements and develops
    their geometric, arithmetic, and measure-theoretic foundations. The two
    main analytic proofs remain incomplete.
  authors:
    - Yongxi Lin
  license: Apache-2.0
  responsible_maintainers:
    - Yongxi Lin

classification:
  arxiv: [math.CA]
  msc2020: [42B25, 28A75]

sources:
  - title: The projection estimate near 1.675
    type: supplied manuscript
    relationship: formalizes
    note: >-
      September 2026 pedagogical rewrite supplied by the project owner.
      Its novel continuous corner and simultaneous-selection assertions are
      not independently certified by the manuscript. Lean now verifies the
      basic pair improvement and exact corner density and fiber identities;
      the full corner improvement and finite-height projection estimates
      at every strictly supercritical exponent are now proved.
      The jointly Borel two-slice selection, quantitative dual-pair and
      common outer-scalar reservoirs, and separated root and child triples
      are proved with explicit polynomial bounds. The finite-coordinate
      seed scheme and joint one-node selection have polynomial parameter
      volume and uniform input constants. Whole-tree selection is jointly
      Borel with a polynomial volume bound including the root triple.
      Measurable labeled heights remain in the original time set, and
      selected parameters realize admissible analytic corner trees using
      only those heights. All tree coordinates have a common polynomial
      bound, and the realization retains uniform geometric and analytic
      control. The explicit stopping coefficient has a polynomial bound
      common to every selected node and tree for fixed balanced-mass
      coefficients. The whole-tree threshold and bounded-size coefficient
      now have polynomial bounds. Every selected parameter satisfies the
      full finite-tree projection estimate with a uniform polynomial
      constant, preserved through multiplicity normalization. Finite-vector
      reindexing preserves volume and coordinate bounds. The selectable
      corner improvement and iteration are now proved, giving a selectable
      scheme at every exponent strictly above the critical root. The
      transfer to mixed-norm X-ray estimates remains incomplete.
    license: unknown
  - title: From Projection Inequalities to Mixed-Norm Local X-Ray Estimates
    type: supplied proof notes
    relationship: formalizes
    note: >-
      September 2026 notes. Joint line-time measurability and small-slice
      removal retaining half the good-time measure are now proved,
      including the zero-volume case. Simultaneous parameter selection and
      the restricted-to-strong mixed-norm argument remain incomplete.
    license: unknown
  - title: Two bounds for the X-ray transform
    authors: [Richard Oberlin]
    id: doi:10.1007/s00209-009-0589-5
    location: https://doi.org/10.1007/s00209-009-0589-5
    type: article
    relationship: adapts
    note: Theorem 3 is the intended mixed-norm-to-positive-measure reduction.
    author_endorsement: not-contacted
  - title: Bounds for Kakeya-type maximal operators associated with k-planes
    authors: [Richard Oberlin]
    id: arXiv:math/0512377
    location: https://arxiv.org/abs/math/0512377
    type: article
    relationship: adapts
    note: Intended induction and Fourier terminal step; not yet formalized.
    author_endorsement: not-contacted
  - title: Polynomial Wolff axioms and Kakeya-type estimates in R4
    authors: [Larry Guth, Joshua Zahl]
    id: arXiv:1701.07045
    location: https://arxiv.org/abs/1701.07045
    type: article
    relationship: adapts
    note: Corrected Proposition 2.1 is a planned proof input, not an axiom.
    author_endorsement: not-contacted
  - title: On the polynomial Wolff axioms
    authors: [Nets Hawk Katz, Keith M. Rogers]
    id: arXiv:1802.09094
    location: https://arxiv.org/abs/1802.09094
    type: article
    relationship: adapts
    note: Theorem 1.1 is a planned proof input, not an assumption on the target sets.
    author_endorsement: not-contacted
  - title: Positive measure for (5,2)-Besicovitch sets
    type: supplied proof draft
    relationship: formalizes
    note: >-
      September 2026 draft present in the local project research material.
      The target is its positive-measure conclusion, using the p=4 operator
      consequence; no priority claim is made.
    license: unknown

related_formalizations: []

status:
  scope: >-
    Partial formalization. The exact critical exponent,
    strict parameter margins, full-dimensional boundary case, normalized disk
    averages, canonical Grassmannian probability and its uniqueness,
    measurability of plate maximal functions on open indicators,
    the exact two-slice projection seed, intrinsic pair-incidence mass,
    dual-height code algebra, double-projection density, low-density deletion,
    the pointwise code marginal, pair-fiber projection bound,
    simultaneous finite density refinement and code-fiber selection,
    the code-density bound by essential parallel multiplicity,
    the full basic pair improvement and its exponent-7/4 consequence,
    exact corner densities, both corner-fiber upper bounds, outer-density
    deletion, initial slice refinement, measurable companions of prescribed
    fiber mass, exact balanced pair and corner masses, restricted corner
    counts, simultaneous corner-code selection, finite corner witnesses,
    inner-code pruning, concentrated projection-image refinement, both
    conditional uses of the input projection estimate on code fibers,
    finite stopping selection under explicit root and terminal bounds,
    the common child construction and concrete child deletion budget,
    the resulting positive corner-family construction, the internally
    budgeted outer threshold, the normalized numerical exponent
    amplification, the finite-depth choice, common constants for each fixed
    corner pattern, the assembled conditional stopping-node estimate,
    root and terminal projection bounds, balanced stopping masses,
    the normalized corner improvement with internally constructed height
    patterns and finite trees, uniform constants, and stopping families,
    dilation restoring the general multiplicity factor, the full corner
    improvement, finite-height projection estimates at every exponent
    strictly above the critical root, the jointly Borel selectable
    two-slice seed, dual-pair and common outer-scalar reservoirs with
    explicit polynomial bounds on parameter measure and time-fiber
    measure, separated root triples and preservation of child-triple
    separation, the finite-coordinate selectable scheme interface and
    its two-slice seed, jointly Borel labeled one-node parameters with
    polynomial parameter volume and uniform input-estimate constants,
    volume-preserving finite tree-coordinate splitting, jointly Borel
    whole-tree and root-triple selection with polynomial parameter volume,
    measurable labeled heights in the original time set, realization of
    selected parameters as analytic corner trees using only those heights,
    polynomial bounds on all tree coordinates independent of depth,
    uniform geometric and analytic control of selected patterns, explicit
    common inner and outer coefficients, propagation of prescribed constants
    through refinement and stopping, a polynomial stopping constant
    common to all selected trees with fixed balanced-mass coefficients,
    polynomial whole-tree thresholds and bounded-size coefficients,
    uniform full projection estimates for all selected parameters,
    volume-preserving reindexing into finite vectors, the selectable
    corner improvement, selectable schemes at every exponent strictly
    above the critical root, joint measurability of local X-ray line-time
    sets, small-slice removal retaining half the time measure including
    zero-volume ambient sets, and
    passage from uniform disk or delta-plate maximal estimates
    on open indicators to a volume lower bound have Lean proofs.
    Two top-level proof gaps stand for substantial undeveloped analytic
    dependencies described in PLAN.md. Their count does not measure the size
    of the remaining work. This snapshot is not ready for Palomar submission.
  sorry_count: 2
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: autonomous
      models: [GPT-6]
      framework: OpenAI Codex
      tool_setup: Lean language server, Mathlib search, Lean kernel, and Lake builds
      prompting_notes: >-
        User requested both full positive-measure results, a minimal faithful
        challenge, explicit proof gaps during development, source audits,
        topic-based modules, and regular GitHub pushes.
  spend_usd: not tracked
  notes: >-
    AI-generated Lean development directed by the project owner. Existing
    supplied research drafts and prose audits are used as references only.
    No human review of the new Lean statements has been recorded.

fidelity:
  divergences: >-
    The statements include the elementary k=n boundary and require 1<=k<=n.
    The disk property uses closed radius-one disks and has no measurable-center
    selection hypothesis. Lebesgue measurability uses NullMeasurableSet.
    The advertised conclusions are incomplete, not replaced by conditional
    variants. Helper analytic implications explicitly display their assumptions.

review:
  status: self-assessed, incomplete
  reviewers: []
  notes: >-
    Source definitions and the exact exponent were checked against supplied
    notes and Oberlin's statement. Challenge imports only Mathlib. Comparator
    is configured to compare definitions, the numerical critical-exponent bounds,
    and both positive-measure theorems, with no permission
    for sorryAx; full verification cannot pass while the proof gaps remain.

alignment:
  namespace: NKBesicovitch
  statements:
    - source: Supplied projection estimate and Oberlin Theorem 3
      lean: NKBesicovitch.volume_pos_of_criticalExponent
      module: Solution
      status: partial
      note: The full target is stated; the proper-dimensional analytic case remains open in Lean.
    - source: Supplied positive-measure (5,2) draft
      lean: NKBesicovitch.volume_pos_five_two
      module: Solution
      status: partial
      note: The full target is stated; the four-dimensional seed and Fourier argument remain open in Lean.

acknowledgements: Mathlib and Lean contributors; authors of the cited mathematical sources.
